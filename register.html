<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BookKeeper</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <div class="login-header">

                <h1>BookKeeper</h1>

                <p>Create your account</p>

            </div>


            <form class="login-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Create Account
                </button>

            </form>


            <div class="signup-section">

                <p>Already have an account?</p>

                <a
                    href="login.html"
                    class="signup-link"
                >
                    Login
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to BookKeeper
                </a>

            </div>

        </div>

    </main>

</body>

</html>
