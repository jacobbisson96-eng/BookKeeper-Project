<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Discover | BookKeeper</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/footer.css">

</head>

<body>

    <header>

        <nav>

            <h2>BookKeeper</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">My Books</a></li>
                <li><a href="discover.html">Discover</a></li>
                <li><a href="statistics.html">Statistics</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>

            <a href="login.html" class="add-book">
                Login
            </a>

        </nav>

    </header>


    <main>

        <section class="hero">

            <h1>Discover Books</h1>

            <p>
                Find your next great read.
            </p>

        </section>


        <section>

            <input
                type="search"
                class="book-search"
                placeholder="Search books..."
            >

        </section>


        <section>

            <h2>Popular Books</h2>

            <div class="book-grid">

                <div class="book-card">
                    <img
                        src="https://via.placeholder.com/240x280"
                        alt="Book cover"
                    >
                    <h3>The Great Gatsby</h3>
                    <p>F. Scott Fitzgerald</p>
                </div>

                <div class="book-card">
                    <img
                        src="https://via.placeholder.com/240x280"
                        alt="Book cover"
                    >
                    <h3>1984</h3>
                    <p>George Orwell</p>
                </div>

                <div class="book-card">
                    <img
                        src="https://via.placeholder.com/240x280"
                        alt="Book cover"
                    >
                    <h3>The Hobbit</h3>
                    <p>J.R.R. Tolkien</p>
                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 BookKeeper. All rights reserved.
        </p>

    </footer>

</body>

</html>
